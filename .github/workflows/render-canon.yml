name: Render canonical YAML
on:
  push:
    branches: [main]
    paths:
      - 'canon/*.yaml'
      - 'scripts/render_canon.py'
      - '.github/workflows/render-canon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render and verify canonical documents
        run: python3 scripts/render_canon.py
      - name: Commit generated changes, if any
        run: |
          git add 'Company SOP 4 XOS-HQ.md'
          if ! git diff --cached --quiet; then
            git -c user.name='xos-canon-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'render: synchronize HQ SOP from YAML'
            git push
          fi
