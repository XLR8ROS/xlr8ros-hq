name: Render and synchronize XOS canonical mirrors

on:
  push:
    branches: [main]
    paths:
      - 'canon/**'
      - 'scripts/sync_canon_mirrors.py'
      - 'tests/test_sync_canon_mirrors.py'
      - '.github/workflows/render-canon.yml'
  pull_request:
    paths:
      - 'canon/**'
      - 'scripts/sync_canon_mirrors.py'
      - 'tests/test_sync_canon_mirrors.py'
      - '.github/workflows/render-canon.yml'
  repository_dispatch:
    types: [xos-canon-source-updated]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: xos-canon-mirror-sync-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Check canonical source, registry, and syntax
        run: |
          python -m py_compile scripts/sync_canon_mirrors.py
          python -m unittest discover -s tests -p 'test_sync_canon_mirrors.py' -v
          python scripts/sync_canon_mirrors.py --validate

  synchronize:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Update registered mirrors and verify read-back
        env:
          XOS_CANON_SYNC_TOKEN: ${{ secrets.XOS_CANON_SYNC_TOKEN }}
        run: |
          if [ -z "$XOS_CANON_SYNC_TOKEN" ]; then
            echo "::error::XOS_CANON_SYNC_TOKEN is missing; downstream synchronization cannot run"
            exit 1
          fi
          python scripts/sync_canon_mirrors.py
