name: Render and synchronize canon mirrors
on:
  push:
    branches: [main]
    paths:
      - 'canon/*.yaml'
      - 'scripts/sync_canon_mirrors.py'
      - '.github/workflows/render-canon.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: xos-canon-mirror-sync
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install YAML parser
        run: python3 -m pip install --user PyYAML
      - name: Render and synchronize registered mirrors
        env:
          XOS_CANON_SYNC_TOKEN: ${{ secrets.XOS_CANON_SYNC_TOKEN }}
        run: python3 scripts/sync_canon_mirrors.py
