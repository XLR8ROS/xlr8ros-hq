name: Render and synchronize XOS Canon
on:
  push:
    branches: [main]
    paths:
      - 'canon/*.yaml'
      - 'scripts/render_canon.py'
      - '.github/workflows/render-canon.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xos-canon-sync-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render HQ Markdown and synchronize registered mirrors
        env:
          XOS_CANON_SYNC_TOKEN: ${{ secrets.XOS_CANON_SYNC_TOKEN }}
        run: python3 scripts/render_canon.py
      - name: Commit HQ generated files
        run: |
          git add -- '*.md' 'SOPs/*.md'
          if ! git diff --cached --quiet; then
            git -c user.name='xos-canon-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'canon: regenerate HQ markdown mirrors'
            git push
          fi
